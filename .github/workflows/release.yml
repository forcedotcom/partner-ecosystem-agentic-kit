name: Publish versioned release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check_release.py --tag "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/prepare_harness.py bundle --target claude-plugin --output advisor-plugin.zip
      - run: python3 scripts/build_review_archive.py --output advisor-source-review.zip
      - name: Publish immutable-version assets and notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          flags=(--latest)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" advisor-plugin.zip advisor-source-review.zip --verify-tag --title "ISV Partner Advisor $RELEASE_TAG" --notes-file docs/releases/current.md "${flags[@]}"
